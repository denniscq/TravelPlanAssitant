# =============================================================================
# Nginx site configuration for TravelPlanAssistant (production).
#
# Replace YOUR_DOMAIN with your real domain before enabling:
#   sudo cp deploy/nginx-tpa.conf /etc/nginx/sites-available/tpa
#   sudo sed -i 's/YOUR_DOMAIN/your-domain.com/g' /etc/nginx/sites-available/tpa
#   sudo ln -s /etc/nginx/sites-available/tpa /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Requires a Let's Encrypt certificate (certbot) BEFORE enabling port 443:
#   sudo certbot --nginx -d YOUR_DOMAIN -d www.YOUR_DOMAIN
#
# NOTE: Only enable this after the ICP filing is approved (see docs).
# =============================================================================

# ---- Single upstream: PM2 cluster shares port 3000 --------------------------
upstream nextjs_upstream {
    server 127.0.0.1:3000;
    keepalive 64;
}

# ---- Port 80: redirect to HTTPS ---------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # Redirect everything to HTTPS (certbot may rewrite this after issuance)
    return 301 https://$host$request_uri;
}

# ---- Port 443: TLS termination + reverse proxy ------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # Let's Encrypt certificates (managed by certbot)
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    # Modern TLS defaults
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # ---- Next.js static assets: cache for 1 year ---------------------------
    location /_next/static/ {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---- Everything else: dynamic requests to Next.js -----------------------
    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;

        # Align with the 90s LLM timeout (AbortSignal.timeout in LLM client)
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;

        # Disable buffering to allow streaming / SSE responses
        proxy_buffering off;
    }
}
